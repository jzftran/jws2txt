[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "jws2txt"
dynamic = ["version"]
authors = [
  { name="Józef Tran", email="jozeftran@gmail.com" },
]
description = "A JASCO file (*.jws and *.jwb) to text file converter."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "olefile~=0.47",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry"  
]

[project.scripts]
jws2txt = "jws2txt.jws2txt:main"

[project.urls]
"Homepage" = "https://github.com/jzftran/jws2txt"
"Bug Tracker" = "https://github.com/jzftran/jws2txt/issues"

[tool.hatch.version]
path = "jws2txt/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["ALL"]